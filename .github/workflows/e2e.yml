# End-to-end tests (tester-army/e2e, deterministic only: no agent steps, no model).
#
# Two targets:
# - `api` (node): read-only HTTP checks against https://tannerwj.com
# - `chromium` (Playwright): rendered-page checks
# No secrets are needed anywhere in this workflow.
name: e2e

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@82076278602674085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx e2e run --reporter list,junit
        env:
          E2E_TELEMETRY_DISABLED: 1
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
          if-no-files-found: warn
